name: Build macOS app

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: honey-bunny-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate app icons from icon.svg
        run: |
          brew install librsvg
          rsvg-convert -w 1024 -h 1024 dist/icon.svg -o app-icon.png
          npx --yes @tauri-apps/cli@latest icon app-icon.png

      - name: Build the macOS app (universal .dmg)
        run: npx --yes @tauri-apps/cli@latest build --target universal-apple-darwin

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-honey-bunny-macos
          path: |
            honey-bunny-app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
